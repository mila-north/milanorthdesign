<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilden Woods Team Logo Kit</title>
  <link rel="stylesheet" href="styles/tilden_woods.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <a href="index.html" class="logo-btn" aria-label="Home">
      <img src="images/my_logo.png" alt="MilaNorthDesign Logo" class="logo-img">
    </a>
  </header>

  <!-- Main Content Showcase -->
  <main class="page-container">
    <div class="slides-grid">

      <!-- Slide 1 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim1.png" alt="Tilden Woods Slide 1" class="slide-img">
        </div>
      </article>

      <!-- Slide 2 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim2.png" alt="Tilden Woods Slide 2" class="slide-img">
        </div>
      </article>

      <!-- Slide 3 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim3.png" alt="Tilden Woods Slide 3" class="slide-img" loading="lazy">
        </div>
      </article>

      <!-- Slide 4 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim4.png" alt="Tilden Woods Slide 4" class="slide-img" loading="lazy">
        </div>
      </article>

      <!-- Slide 5 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim5.png" alt="Tilden Woods Slide 5" class="slide-img" loading="lazy">
        </div>
      </article>

      <!-- Slide 6 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim6.png" alt="Tilden Woods Slide 6" class="slide-img" loading="lazy">
        </div>
      </article>

      <!-- Slide 7 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim7.png" alt="Tilden Woods Slide 7" class="slide-img" loading="lazy">
        </div>
      </article>

      <!-- Slide 8 -->
      <article class="slide-card">
        <div class="slide-image-wrapper">
          <img src="images/swim8.png" alt="Tilden Woods Slide 8" class="slide-img" loading="lazy">
        </div>
      </article>

    </div>
  </main>

</body>
</html>
