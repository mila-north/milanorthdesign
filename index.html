<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MilaNorthDesign - Brand & Visual Design</title>
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>

  <header class="navbar">
    <a href="" class="logo-btn">
      <img src="images/my_logo.png" alt="MilaNorthDesign Logo" class="logo-img">
    </a>

    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="menu-text">Menu</span>
    </button>

    <div class="nav-container">
      <nav class="nav-menu" id="navMenu">
        <a href="about_me.html" class="nav-btn">About me</a>
        <a href="design_approach.html" class="nav-btn">Design Approach</a>
        <button type="button" class="nav-btn contact-btn" id="contactBtn">Contacts</button>
      </nav>

      <div class="profile-dropdown" id="profileDropdown">
        <span class="email-text">milanorth.info@gmail.com</span>
      </div>
    </div>
  </header>

  <main class="hero-container">
    <h1 class="hero-title">Brand & Visual Design</h1>

    <section class="cards-grid">
      
      <a href="healthcare_ai.html" class="card">
        <div class="card-bg" style="background-image: url('images/ai.png');"></div>
        <div class="card-overlay"></div>
        <h2 class="card-title">Healthcare & AI</h2>
      </a>

      <a href="brand_systems.html" class="card">
        <div class="card-bg" style="background-image: url('images/tee.png');"></div>
        <div class="card-overlay"></div>
        <h2 class="card-title">Brand Systems</h2>
      </a>

      <a href="apparel_more.html" class="card">
        <div class="card-bg" style="background-image: url('images/backpack.png');"></div>
        <div class="card-overlay"></div>
        <h2 class="card-title">Apparel & More</h2>
      </a>

    </section>
  </main>

  <script>
    const hamburger = document.getElementById('hamburger-btn');
    const navMenu = document.getElementById('navMenu');
    const contactBtn = document.getElementById('contactBtn');
    const profileDropdown = document.getElementById('profileDropdown');

    // Toggle Mobile Navigation
    hamburger.addEventListener('click', (e) => {
      e.stopPropagation();
      navMenu.classList.toggle('active');
    });

    // Toggle Contacts Email Dropdown
    contactBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('show');
    });

    // Close Dropdowns on Outside Click
    document.addEventListener('click', (e) => {
      if (!profileDropdown.contains(e.target) && e.target !== contactBtn) {
        profileDropdown.classList.remove('show');
      }
      if (!navMenu.contains(e.target) && !hamburger.contains(e.target)) {
        navMenu.classList.remove('active');
      }
    });
  </script>

</body>
</html>
