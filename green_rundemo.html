<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bethesda Green Demo</title>
  <link rel="stylesheet" href="styles/green_rundemo.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="header">
    <a href="index.html" class="logo-link" aria-label="Return to Home">
      <img src="images/my_logo.png" alt="MilaNorth Design" class="logo-img">
    </a>
  </header>

  <!-- Main Showcase Area: Dual Video Player Layout -->
  <main class="content-wrapper">
    <div class="video-grid">
      
      <!-- Video Frame 1 -->
      <div class="video-card">
        <video class="video-player" controls poster="images/bg_annualreport_cover.png" preload="metadata">
          <source src="media/bethesda-annual_icons.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>

      <!-- Video Frame 2 -->
      <div class="video-card">
        <video class="video-player" controls poster="images/icon_system_cover.png" preload="metadata">
          <source src="media/bethesda_iconsanimation.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>

    </div>
  </main>

</body>
</html>
